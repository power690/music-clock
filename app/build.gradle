plugins {
    id 'com.android.application'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}

def storeFilePath = localProps.getProperty('storeFile') ?: System.getenv('STORE_FILE')
def storePassword = localProps.getProperty('storePassword') ?: System.getenv('STORE_PASSWORD')
def keyAlias = localProps.getProperty('keyAlias') ?: System.getenv('KEY_ALIAS')
def keyPassword = localProps.getProperty('keyPassword') ?: System.getenv('KEY_PASSWORD')

android {
    namespace 'com.xiaowei.music'
    compileSdk 37
    compileSdkMinor 0

    ndkVersion "29.0.14033849"

    defaultConfig {
        applicationId "com.xiaowei.music"
        minSdk 21
        targetSdk 37
        versionCode 2
        versionName "1.1.0"

        vectorDrawables {
            useSupportLibrary true
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++11"

                arguments "-DCMAKE_SUPPRESS_REGENERATION=TRUE"
            }
        }

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    signingConfigs {
        if (storeFilePath != null && storePassword != null && keyAlias != null && keyPassword != null) {
            release {
                storeFile file(storeFilePath)
                storePassword storePassword
                keyAlias keyAlias
                keyPassword keyPassword
                v1SigningEnabled true
                v2SigningEnabled true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            if (storeFilePath != null && storePassword != null && keyAlias != null && keyPassword != null) {
                signingConfig signingConfigs.release
            } else {

                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs += 'src/main/kotlin'
        }
    }

    buildFeatures {
        viewBinding true
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "4.1.2"
        }
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'

    implementation 'androidx.media:media:1.7.0'

    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'
    implementation 'androidx.media3:media3-common:1.5.1'

    implementation 'com.github.HeHang0:exoplayer-extension-flac:1.3.1'

    implementation 'androidx.lifecycle:lifecycle-process:2.8.7'

    implementation 'com.mpatric:mp3agic:0.9.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
